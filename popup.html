<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <header class="header">
      <h1 data-i18n="popup.title">Laracasts Translator</h1>
      <label class="toggle-switch">
        <input type="checkbox" id="enableToggle" checked>
        <span class="slider"></span>
      </label>
    </header>

    <!-- API Key -->
    <section class="section">
      <label class="label">
        <span data-i18n="popup.apiKey.label">OpenAI API Key</span>
        <a href="https://platform.openai.com/api-keys" target="_blank" class="api-key-link" data-i18n="popup.apiKey.link">(API key almak için tıklayın)</a>
      </label>
      <div class="api-key-row">
        <input type="password" id="apiKey" data-i18n-placeholder="popup.apiKey.placeholder" placeholder="sk-..." class="input">
        <button id="toggleApiKey" class="btn-icon" data-i18n-title="popup.apiKey.toggleTitle" title="Göster/Gizle">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
      <div id="apiKeyStatus" class="status"></div>
    </section>

    <!-- Dil ve Model -->
    <section class="section">
      <h2 class="section-title" data-i18n="popup.language.section">Dil ve Model</h2>

      <div class="lang-row">
        <div class="setting-row">
          <label class="label" data-i18n="popup.language.ui">Arayüz dili</label>
          <select id="uiLanguage" class="select"></select>
        </div>
        <div class="setting-row">
          <label class="label" data-i18n="popup.language.target">Çeviri hedef dili</label>
          <select id="targetLanguage" class="select"></select>
        </div>
      </div>

      <div class="setting-row">
        <label class="label" data-i18n="popup.model.label">OpenAI modeli</label>
        <div class="model-row">
          <select id="openaiModel" class="select"></select>
          <button id="refreshModels" class="btn-icon" data-i18n-title="popup.model.refresh" title="Modelleri yenile">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="23 4 23 10 17 10"/>
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
            </svg>
          </button>
        </div>
        <div id="modelStatus" class="status"></div>
      </div>
    </section>

    <!-- Altyazı Ayarları -->
    <section class="section">
      <h2 class="section-title" data-i18n="popup.subtitle.title">Altyazı Ayarları</h2>

      <div class="checkbox-row">
        <label>
          <input type="checkbox" id="showOriginal" checked>
          <span data-i18n="popup.subtitle.showOriginal">Orijinal altyazıyı göster</span>
        </label>
        <label>
          <input type="checkbox" id="showTranslation" checked>
          <span data-i18n="popup.subtitle.showTranslation">Çeviriyi göster</span>
        </label>
        <label>
          <input type="checkbox" id="blurOriginal">
          <span data-i18n="popup.subtitle.blurOriginal">Orijinali bulanıklaştır</span><span class="help-icon" data-i18n-tooltip="popup.subtitle.blurOriginalTooltip" data-tooltip="Öğrenme modu: orijinal metin bulanık görünür, fare üzerine gelince netleşir.">?</span>
        </label>
      </div>

      <div class="colors-fontsize">
        <div>
          <label class="label" data-i18n="popup.subtitle.originalColor">Orijinal renk</label>
          <input type="color" id="originalColor" value="#ffffff">
        </div>
        <div>
          <label class="label" data-i18n="popup.subtitle.translationColor">Çeviri renk</label>
          <input type="color" id="translationColor" value="#ffd700">
        </div>
        <div>
          <label class="label"><span data-i18n="popup.subtitle.fontSize">Yazı boyutu</span>: <span id="fontSizeValue">25</span>px</label>
          <input type="range" id="fontSize" min="18" max="45" value="25" class="range">
        </div>
      </div>

      <div class="setting-row">
        <label class="label"><span data-i18n="popup.subtitle.bgOpacity">Arka plan opaklığı</span>: <span id="bgOpacityValue">75</span>%</label>
        <input type="range" id="bgOpacity" min="0" max="100" value="75" class="range">
      </div>
    </section>

    <!-- Önbellek + Aksiyonlar -->
    <section class="section">
      <h2 class="section-title" data-i18n="popup.cache.title">Önbellek</h2>
      <div id="cacheStats" class="cache-stats" data-i18n="popup.cache.loading">Yükleniyor...</div>
      <div class="actions-row">
        <button id="resetDefaults" class="btn btn-secondary" data-i18n="popup.reset">Varsayılana Sıfırla</button>
        <button id="clearCache" class="btn btn-danger" data-i18n="popup.cache.clear">Önbelleği Temizle</button>
      </div>
    </section>
  </div>

  <script src="lib/constants.js"></script>
  <script src="lib/cache-keys.js"></script>
  <script src="lib/crypto-vault.js"></script>
  <script src="lib/storage.js"></script>
  <script src="lib/languages.js"></script>
  <script src="lib/i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
